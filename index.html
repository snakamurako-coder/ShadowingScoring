<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #2c3e50;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    /* Control Panel */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    select,
    button {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 100%;
      font-size: 16px;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    button.record-btn {
      background-color: #e74c3c;
    }

    /* Status & Loader */
    #status-area {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      height: 24px;
      color: #e67e22;
    }

    #loader {
      display: none;
      width: 100%;
      height: 4px;
      background-color: #f3f3f3;
      margin-top: 10px;
      overflow: hidden;
    }

    #loader-bar {
      width: 50%;
      height: 100%;
      background-color: #3498db;
      animation: loading 1s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(200%);
      }
    }

    /* Results */
    #result-area {
      margin-top: 20px;
      padding: 15px;
      background: #fafafa;
      border: 1px solid #eee;
      display: none;
    }

    .score-display {
      font-size: 1.5em;
      font-weight: bold;
      color: #27ae60;
      position: relative;
      display: inline-block;
      padding: 0 10px;
    }

    .score-container {
      position: relative;
      display: inline-block;
      margin: 0 10px;
    }

    .score-arch {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
      border: 3px solid #27ae60;
      border-bottom: none;
      border-radius: 60px 60px 0 0;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes archDraw {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.3) translateY(10px);
      }
      50% {
        opacity: 0.8;
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) scale(1) translateY(0);
      }
    }

    .score-formula {
      font-size: 0.85em;
      color: #666;
      margin-top: 5px;
      font-family: 'Courier New', monospace;
    }

    .diff-text {
      white-space: pre-wrap;
      margin-top: 10px;
      font-family: monospace;
    }

    /* New UI Elements */
    .stt-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stt-box {
      padding: 10px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
    }

    .stt-box h4 {
      margin-top: 0;
      border-bottom: 1px solid #eee;
    }

    .highlight-added {
      background-color: #e3f2fd;
      color: #1976d2;
    }

    /* Blue for added words */
    .highlight-missing {
      background-color: #ffebee;
      color: #c62828;
    }

    /* Red for missing words */
    .highlight-wildcard {
      background-color: #fff9c4;
      color: #f57f17;
      font-weight: bold;
    }

    /* Yellow for wildcard matches */

    .practice-list {
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .practice-item {
      display: inline-block;
      margin: 5px;
      padding: 5px 10px;
      background: #fff3e0;
      border-radius: 15px;
      font-size: 14px;
    }

    .speak-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #e67e22;
      font-size: 1.2em;
      padding: 0 0 0 5px;
    }

    .volume-meter {
      width: 100%;
      height: 10px;
      background: #eee;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 5px;
    }

    .volume-bar {
      height: 100%;
      width: 0%;
      background: #27ae60;
      transition: width 0.1s;
    }

    .volume-bar.warning {
      background: #f1c40f;
    }

    .volume-bar.clip {
      background: #e74c3c;
    }

    #reading-mode-area {
      display: none;
      margin-top: 20px;
    }

    #reading-text-area {
      width: 100%;
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 15px;
      background: #fff;
      font-size: 24px;
      line-height: 3.2;
    }

    .scroll-btn {
      width: 100%;
      margin-top: 5px;
      background: #bdc3c7;
      color: #333;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Shadowing Practice</h2>
      <div style="text-align:right;">
        <div id="user-display">Loading User...</div>
        <button onclick="loadMaterials(true)"
          style="width:auto; padding: 2px 8px; font-size:10px; margin-top:5px;">Refresh Books</button>
      </div>
    </div>

    <div class="controls">
      <select id="sel-book" onchange="onBookChange()">
        <option value="">Select Book</option>
      </select>
      <select id="sel-unit" onchange="onUnitChange()" disabled>
        <option value="">Select Unit</option>
      </select>
    </div>

    <div class="controls">
      <select id="sel-task" onchange="onTaskChange()" disabled>
        <option value="">Select Task</option>
      </select>
      <select id="sel-speed">
        <option value="0.6">Speed: x0.6</option>
        <option value="0.7">Speed: x0.7</option>
        <option value="0.8">Speed: x0.8</option>
        <option value="0.9">Speed: x0.9</option>
        <option value="1.0" selected>Speed: x1.0 (Normal)</option>
        <option value="1.1">Speed: x1.1</option>
        <option value="1.2">Speed: x1.2</option>
      </select>
    </div>

    <div class="controls">
      <div>
        <label style="font-size:12px; color:#666;">Accent:</label>
        <select id="sel-accent" style="margin-top:5px;">
          <option value="en-US" selected>US English</option>
          <option value="en-GB">UK English</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; color:#666;">Mic Volume:</label>
        <div class="volume-meter">
          <div id="volume-bar" class="volume-bar"></div>
        </div>
        <input type="range" id="mic-gain" min="0.5" max="3.0" step="0.1" value="1.0"
          style="width:100%; margin-top:5px;">
      </div>
    </div>

    <div id="button-area" style="text-align:center; margin-top: 20px; display:flex; justify-content: center; gap: 20px;">
      <button id="btn-start" onclick="startShadowing()" disabled style="width: 180px; height: 50px; font-size: 18px;">
        Start Shadowing
      </button>
      <button id="btn-finish-reading" onclick="finishReading()" disabled
        style="width: 150px; height: 50px; font-size: 18px; background-color: #27ae60; display: none;">
        Finish Reading
      </button>
      <button id="btn-stop" onclick="stopShadowingWithConfirm()" disabled
        style="width: 100px; height: 50px; font-size: 18px; background-color: #95a5a6;">
        Stop
      </button>
    </div>

    <div id="loader">
      <div id="loader-bar"></div>
    </div>
    <div id="status-area">Ready</div>

    <audio id="audio-player" style="display:none;"></audio>

    <div id="reading-mode-area">
      <button class="scroll-btn" onclick="scrollRead(-50)">▲ Scroll Up</button>
      <div id="reading-text-area"></div>
      <button class="scroll-btn" onclick="scrollRead(50)">▼ Scroll Down</button>
    </div>

    <div id="result-area">
      <div style="margin-bottom: 15px;">
        <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
          <div class="score-container">
            <div class="score-arch" id="reading-arch"></div>
            Reading Score: <span id="score-val" class="score-display">--</span>%
            <div class="score-formula" id="reading-formula"></div>
          </div>
          <div class="score-container" id="shadowing-score-container" style="display: none;">
            <span style="margin: 0 10px;">|</span>
            <div class="score-arch" id="shadowing-arch"></div>
            Shadowing Score: <span id="shadow-score-val" class="score-display">--</span>%
            <div class="score-formula" id="shadowing-formula"></div>
          </div>
        </div>
      </div>

      <div class="stt-comparison">
        <div class="stt-box">
          <h4>Your Speech (STT)</h4>
          <div id="user-stt-display"></div>
        </div>
        <div class="stt-box">
          <h4>Reference Text</h4>
          <div id="ref-text-display"></div>
        </div>
      </div>

      <div class="practice-list" id="practice-area">
        <h4>Pronunciation Practice</h4>
        <div id="practice-items"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Global Variables ---
    let currentUser = { name: '', id4: '' };
    let materials = {};
    let currentTask = null;
    let audioBlobUrl = null;
    let recognition = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let finalTranscript = '';
    let isShadowing = false;
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let gainNode = null;
    let silenceTimer = null;
    let isReadingMode = false;

    // --- Initialization ---
    window.onload = function () {
      google.script.run.withSuccessHandler(user => {
        currentUser = user;
        document.getElementById('user-display').innerText = `${user.name} (${user.id4})`;
        if (!user.isAuthorized) alert("Unregistered User. Please contact admin.");

        // Load Materials
        loadMaterials();
      }).getUserInfo();
    };



    function loadMaterials(forceUpdate = false) {
      if (forceUpdate) setStatus("Updating Materials Cache...", true);

      const runner = forceUpdate ? google.script.run.withSuccessHandler(updateUIWithMaterials).updateMaterialsCache()
        : google.script.run.withSuccessHandler(updateUIWithMaterials).getMaterialsStructure();
    }

    function updateUIWithMaterials(data) {
      materials = data;
      const bookSel = document.getElementById('sel-book');
      bookSel.innerHTML = '<option value="">Select Book</option>';
      for (let book in materials) {
        let opt = document.createElement('option');
        opt.value = book;
        opt.text = book;
        bookSel.add(opt);
      }
      setStatus("Ready", false);
    }

    // --- Dropdown Logic ---
    function onBookChange() {
      const book = document.getElementById('sel-book').value;
      const unitSel = document.getElementById('sel-unit');
      unitSel.innerHTML = '<option value="">Select Unit</option>';
      unitSel.disabled = !book;
      document.getElementById('sel-task').innerHTML = '<option value="">Select Task</option>';
      document.getElementById('sel-task').disabled = true;
      document.getElementById('btn-start').disabled = true;

      if (book) {
        for (let unit in materials[book]) {
          let opt = document.createElement('option');
          opt.value = unit;
          opt.text = unit;
          unitSel.add(opt);
        }
      }
    }

    function onUnitChange() {
      const book = document.getElementById('sel-book').value;
      const unit = document.getElementById('sel-unit').value;
      const taskSel = document.getElementById('sel-task');
      taskSel.innerHTML = '<option value="">Select Task</option>';
      taskSel.disabled = !unit;
      document.getElementById('btn-start').disabled = true;

      if (unit) {
        const tasks = materials[book][unit];
        tasks.forEach(t => {
          let opt = document.createElement('option');
          opt.value = JSON.stringify(t); // Store whole object
          opt.text = `No.${t.id}: ${t.title}`;
          taskSel.add(opt);
        });
      }
    }

    function onTaskChange() {
      const val = document.getElementById('sel-task').value;
      const btn = document.getElementById('btn-start');

      if (val) {
        currentTask = JSON.parse(val);

        // Check for Reading Mode (No Audio)
        if (!currentTask.audioName) {
          isReadingMode = true;
          document.getElementById('reading-mode-area').style.display = 'block';
          document.getElementById('reading-text-area').innerText = currentTask.displayText || currentTask.refText;
          document.getElementById('btn-start').innerHTML = "Start Reading";
          document.getElementById('btn-start').disabled = false;
          document.getElementById('btn-finish-reading').style.display = 'none'; // Hide until recording starts
          document.getElementById('sel-speed').disabled = true; // No speed for reading
          // Adjust button area spacing for reading mode
          document.getElementById('button-area').style.gap = '20px';
          setStatus('Reading Mode', false);
        } else {
          isReadingMode = false;
          document.getElementById('reading-mode-area').style.display = 'none';
          document.getElementById('btn-start').innerHTML = "Start Shadowing";
          document.getElementById('btn-start').disabled = true; // Wait for audio
          document.getElementById('btn-finish-reading').style.display = 'none'; // Hide in shadowing mode
          document.getElementById('sel-speed').disabled = false;
          // Reset button area spacing for shadowing mode
          document.getElementById('button-area').style.gap = '20px';
          downloadAudio(currentTask.audioName);
        }
      } else {
        document.getElementById('btn-start').disabled = true;
      }
    }

    function scrollRead(offset) {
      const el = document.getElementById('reading-text-area');
      el.scrollTop += offset;
    }

    function finishReading() {
      // Finish Reading button - submit the recording
      stopShadowing(true);
    }

    // --- Audio Loading ---
    function downloadAudio(filename) {
      setStatus('Downloading audio...', true);
      google.script.run.withSuccessHandler(res => {
        // Convert Base64 to Blob URL for caching in browser memory
        const byteCharacters = atob(res.base64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: res.mime }); // Opus or MP3

        if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);
        audioBlobUrl = URL.createObjectURL(blob);

        const audioEl = document.getElementById('audio-player');
        audioEl.src = audioBlobUrl;

        setStatus('Ready to Start', false);
        document.getElementById('btn-start').disabled = false;
      }).getAudioData(filename);
    }

    // --- Shadowing Logic ---
    async function setupAudioContext(stream) {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();

      microphone = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;

      // Gain Node for Mic Volume Logic if needed (digital gain)
      gainNode = audioContext.createGain();
      const gainVal = parseFloat(document.getElementById('mic-gain').value);
      gainNode.gain.value = gainVal;

      microphone.connect(gainNode);
      gainNode.connect(analyser); // Do not connect to destination to avoid feedback

      drawVolume();
    }

    function drawVolume() {
      if (!isShadowing) return;
      requestAnimationFrame(drawVolume);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      // Average volume
      let sum = 0;
      for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
      let average = sum / bufferLength;

      // 0-255 -> 0-100%
      let vol = (average / 100) * 100;
      if (vol > 100) vol = 100;

      const bar = document.getElementById('volume-bar');
      bar.style.width = vol + '%';

      // Colors
      if (vol > 90) { bar.className = 'volume-bar clip'; }
      else if (vol < 10) { bar.className = 'volume-bar warning'; }
      else { bar.className = 'volume-bar'; }

      // Updating Gain dynamically if slider moves
      const currentGain = parseFloat(document.getElementById('mic-gain').value);
      if (gainNode && Math.abs(gainNode.gain.value - currentGain) > 0.1) {
        gainNode.gain.setValueAtTime(currentGain, audioContext.currentTime);
      }
    }

    async function startShadowing() {
      if (isShadowing) return;
      isShadowing = true;
      finalTranscript = '';
      audioChunks = [];

      const audioEl = document.getElementById('audio-player');
      const speed = parseFloat(document.getElementById('sel-speed').value);
      audioEl.playbackRate = speed;

      // UI Update
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-stop').disabled = false;
      if (isReadingMode) {
        document.getElementById('btn-finish-reading').style.display = 'inline-block';
        document.getElementById('btn-finish-reading').disabled = false;
        // Adjust spacing: Finish Reading and Stop buttons with wider gap
        document.getElementById('button-area').style.gap = '60px';
      }
      document.getElementById('result-area').style.display = 'none';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        // Audio Context (Volume)
        setupAudioContext(stream);

        // Recorder Init
        const options = { mimeType: 'audio/webm;codecs=opus' };
        mediaRecorder = new MediaRecorder(stream, options);

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        // STT Init
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        const accent = document.getElementById('sel-accent').value;
        recognition.lang = accent;
        recognition.interimResults = false;
        recognition.continuous = true;

        recognition.onresult = event => {
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript + ' ';
            }
          }
        };

        // Start Logic
        if (isReadingMode) {
          setStatus("Reading... (Recording)", true);
          mediaRecorder.start();
          recognition.start();
        } else {
          // Shadowing Mode
          setStatus("Wait 3s... (Get Ready)", true);
          mediaRecorder.start();
          recognition.start();

          setTimeout(() => {
            setStatus("Shadowing! (Listening & Recording)", true);
            audioEl.play();

            audioEl.onended = () => {
              setStatus("Audio Ended. Waiting 3s...", true);
              setTimeout(() => { stopShadowing(true); }, 3000); // Auto submit
            };
          }, 3000);
        }

      } catch (err) {
        console.error(err);
        alert("Microphone error: " + err.message);
        isShadowing = false;
        setStatus("Error", false);
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;
        // Revert reading mode button state changes
        if (isReadingMode) {
          document.getElementById('btn-finish-reading').style.display = 'none';
          document.getElementById('btn-finish-reading').disabled = true;
          // Reset button spacing
          document.getElementById('button-area').style.gap = '20px';
        }
      }
    }

    // Stop button with confirmation dialog
    function stopShadowingWithConfirm() {
      if (!isShadowing) return;
      
      const confirmed = confirm("途中までの記録は、文字起こし・音声ともにデータは削除されてしまいますが、良いですか？\n\nはい（OK）: 削除して停止\nいいえ（キャンセル）: 続行");
      
      if (confirmed) {
        // はい = 削除して停止
        stopShadowing(false);
      }
      // いいえ = 続行（何もしない）
    }

    function stopShadowing(isSubmit = true) {
      if (!isShadowing) return;

      // Stop STT & Audio
      if (recognition) recognition.stop();
      const audioEl = document.getElementById('audio-player');
      audioEl.pause();
      audioEl.currentTime = 0;

      // Stop Recorder
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();

        if (mediaRecorder) {
          mediaRecorder.onstop = async () => {
          // Stop Tracks
          mediaRecorder.stream.getTracks().forEach(track => track.stop());
          isShadowing = false;
          document.getElementById('btn-start').disabled = false;
          document.getElementById('btn-stop').disabled = true;
          if (isReadingMode) {
            document.getElementById('btn-finish-reading').style.display = 'none';
            document.getElementById('btn-finish-reading').disabled = true;
            // Reset button spacing
            document.getElementById('button-area').style.gap = '20px';
          }

          if (!isSubmit) {
            setStatus("Stopped.", false);
            return; // Exit without processing
          }

          setStatus("Processing results...", true);

          const blob = new Blob(audioChunks, { 'type': 'audio/webm;codecs=opus' });

          // --- Scoring Logic ---
          const refText = currentTask.refText;
          const userText = finalTranscript.trim();

          // 1. Reading Score (Base) - WER based
          const { wer: rate, dist, refLen, hypLen } = wer(refText, userText);
          // Simple score: 1 - WER, floored at 0
          const readingScore = Math.max(0, Math.round(100 * (1 - rate)));

          // 2. Shadowing Score (Correction)
          // Score = Reading Score * (1 + (Speed - 1) / 2)
          const speed = parseFloat(document.getElementById('sel-speed').value);
          // If Reading Mode (No Speed), treat as 1.0
          const usedSpeed = isReadingMode ? 1.0 : speed;

          // 補正係数の計算: correctionFactor = 1 + (playbackSpeed - 1) / 2
          const correctionFactor = 1 + (usedSpeed - 1) / 2;
          // シャドーイングスコアの計算: accuracy × correctionFactor（最大100）
          const shadowingScore = Math.min(100, Math.round(readingScore * correctionFactor));

          // Display Results
          document.getElementById('result-area').style.display = 'block';
          
          // Display Reading Score with animation and formula
          const readingFormula = `音読スコア = max(0, round(100 × (1 - WER))) = max(0, round(100 × (1 - ${rate.toFixed(3)}))) = ${readingScore}`;
          displayScoreWithAnimation('score-val', readingScore, 'reading-arch', 'reading-formula', 
            readingFormula, false);
          
          // Display Shadowing Score only if not in reading mode
          if (!isReadingMode) {
            document.getElementById('shadowing-score-container').style.display = 'block';
            const shadowingFormula = `シャドーイングスコア = min(100, 音読スコア × (1 + (再生速度 - 1) / 2)) = min(100, ${readingScore} × ${correctionFactor.toFixed(2)}) = ${shadowingScore}`;
            displayScoreWithAnimation('shadow-score-val', shadowingScore, 'shadowing-arch', 'shadowing-formula',
              shadowingFormula, true);
          } else {
            document.getElementById('shadowing-score-container').style.display = 'none';
          }

          // Visual Comparison
          compareAndVisualize(refText, userText);

          // Upload
          uploadData(blob, shadowingScore, readingScore, usedSpeed, userText);
          setStatus("Finished", false);
        };
        }
      } else {
        isShadowing = false;
      }
    }

    // --- Wildcard-aware tokenization & utilities ---
    const WILDCARD_MAX_CONSUME = 2; // How many user tokens a wildcard can absorb
    const FUZZY_DISTANCE_THRESHOLD = 1; // Levenshtein distance threshold for fuzzy match
    
    // Helper: wildcard marker check (case-insensitive)
    function isWildcard(word) {
      return /^__WILDCARD_\d+__$/i.test(word);
    }
    
    // Levenshtein distance (small tokens, simple implementation)
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }
    
    // Fuzzy match for proper nouns / rare words
    function isFuzzyMatch(a, b) {
      if (!a || !b) return false;
      const dist = levenshtein(a, b);
      return dist <= FUZZY_DISTANCE_THRESHOLD;
    }
    
    // Tokenize reference text, marking wildcard spans without inserting tokens
    function tokenizeRefWithWildcards(text) {
      const segments = [];
      let last = 0;
      let wildcardId = 0;
      const regex = /【([^】]*)】/g;
      let m;
      const wildcardTexts = [];
      while ((m = regex.exec(text)) !== null) {
        if (m.index > last) segments.push({ text: text.slice(last, m.index), wildcard: false });
        segments.push({ text: m[1], wildcard: true, spanId: wildcardId });
        wildcardTexts[wildcardId] = m[1];
        wildcardId++;
        last = m.index + m[0].length;
      }
      if (last < text.length) segments.push({ text: text.slice(last), wildcard: false });
    
      const rawTokens = [];
      const normTokens = [];
      const isWildcardToken = [];
      const spanIds = [];
    
      const wordRegex = /[A-Za-z']+/g;
      segments.forEach(seg => {
        let w;
        while ((w = wordRegex.exec(seg.text)) !== null) {
          const raw = w[0];
          rawTokens.push(raw);
          normTokens.push(raw.toLowerCase());
          isWildcardToken.push(!!seg.wildcard);
          spanIds.push(seg.wildcard ? seg.spanId : -1);
        }
      });
    
      return { rawTokens, normTokens, isWildcardToken, spanIds, wildcardTexts };
    }
    
    // Tokenize user text (no wildcards)
    function tokenizeUser(text) {
      const wordRegex = /[A-Za-z']+/g;
      const rawTokens = [];
      const normTokens = [];
      let m;
      while ((m = wordRegex.exec(text)) !== null) {
        const raw = m[0];
        rawTokens.push(raw);
        normTokens.push(raw.toLowerCase());
      }
      return { rawTokens, normTokens };
    }

    // Wildcard-aware diff with fuzzy match
    function diffWordsWithIndex(r, h) {
      const ref = tokenizeRefWithWildcards(r);
      const user = tokenizeUser(h);
      const R = ref.normTokens;
      const H = user.normTokens;
      const n = R.length;
      const m = H.length;
    
      const dp = Array.from({ length: n + 1 }, () =>
        Array.from({ length: m + 1 }, () => ({ cost: Infinity, prev: null }))
      );
      dp[0][0].cost = 0;
      for (let j = 1; j <= m; j++) {
        dp[0][j].cost = j;
        dp[0][j].prev = { i: 0, j: j - 1, op: 'ins' };
      }
      for (let i = 1; i <= n; i++) {
        const wild = ref.isWildcardToken[i - 1];
        dp[i][0].cost = wild ? 0 : i;
        dp[i][0].prev = { i: i - 1, j: 0, op: wild ? 'w0' : 'del' };
      }
    
      for (let i = 0; i < n; i++) {
        for (let j = 0; j <= m; j++) {
          const cur = dp[i][j];
          if (cur.cost === Infinity) continue;
          const isWild = ref.isWildcardToken[i];
    
          if (isWild) {
            // consume 0
            if (cur.cost < dp[i + 1][j].cost) {
              dp[i + 1][j] = { cost: cur.cost, prev: { i, j, op: 'w0' } };
            }
            // consume 1
            if (j < m && cur.cost < dp[i + 1][j + 1].cost) {
              dp[i + 1][j + 1] = { cost: cur.cost, prev: { i, j, op: 'w1' } };
            }
            // consume 2
            if (j + 1 < m && cur.cost < dp[i + 1][j + 2].cost) {
              dp[i + 1][j + 2] = { cost: cur.cost, prev: { i, j, op: 'w2' } };
            }
          } else {
            // substitution / match (with fuzzy)
            if (j < m) {
              const fuzzy = isFuzzyMatch(R[i], H[j]);
              const cost = R[i] === H[j] || fuzzy ? 0 : 1;
              const op = cost === 0 ? (R[i] === H[j] ? 'match' : 'fuzzy') : 'sub';
              if (cur.cost + cost < dp[i + 1][j + 1].cost) {
                dp[i + 1][j + 1] = { cost: cur.cost + cost, prev: { i, j, op } };
              }
            }
            // deletion
            if (cur.cost + 1 < dp[i + 1][j].cost) {
              dp[i + 1][j] = { cost: cur.cost + 1, prev: { i, j, op: 'del' } };
            }
            // insertion
            if (j < m && cur.cost + 1 < dp[i][j + 1].cost) {
              dp[i][j + 1] = { cost: cur.cost + 1, prev: { i, j, op: 'ins' } };
            }
          }
        }
      }
    
      // Traceback
      let i = n, j = m;
      const matchR = new Set();
      const matchH = new Set();
      const fuzzyR = new Set();
      const fuzzyH = new Set();
      const wildcardToUserWords = new Map();
      const userMatchedToWildcard = new Set();
      const missedIdx = [];
      const addedIdx = [];
    
      while (i > 0 || j > 0) {
        const node = dp[i][j];
        if (!node || !node.prev) break;
        const { i: pi, j: pj, op } = node.prev;
    
        if (op === 'match') {
          matchR.add(i - 1);
          matchH.add(j - 1);
        } else if (op === 'fuzzy') {
          matchR.add(i - 1);
          matchH.add(j - 1);
          fuzzyR.add(i - 1);
          fuzzyH.add(j - 1);
        } else if (op === 'sub') {
          missedIdx.push(i - 1);
          addedIdx.push(j - 1);
        } else if (op === 'del') {
          missedIdx.push(i - 1);
        } else if (op === 'ins') {
          addedIdx.push(j - 1);
        } else if (op === 'w0') {
          // no consumption
        } else if (op === 'w1') {
          if (!wildcardToUserWords.has(i - 1)) wildcardToUserWords.set(i - 1, []);
          wildcardToUserWords.get(i - 1).push(pj);
          userMatchedToWildcard.add(pj);
        } else if (op === 'w2') {
          if (!wildcardToUserWords.has(i - 1)) wildcardToUserWords.set(i - 1, []);
          wildcardToUserWords.get(i - 1).push(pj);
          wildcardToUserWords.get(i - 1).push(pj + 1);
          userMatchedToWildcard.add(pj);
          userMatchedToWildcard.add(pj + 1);
        }
    
        i = pi;
        j = pj;
      }
    
      missedIdx.reverse();
      addedIdx.reverse();
    
      return {
        R: ref.rawTokens,
        H: user.rawTokens,
        isWildcardToken: ref.isWildcardToken,
        spanIds: ref.spanIds,
        wildcardTexts: ref.wildcardTexts,
        missedIdx,
        addedIdx,
        missed: missedIdx.map(k => ref.rawTokens[k]),
        added: addedIdx.map(k => user.rawTokens[k]),
        matchR,
        matchH,
        wildcardToUserWords,
        userMatchedToWildcard,
        fuzzyR,
        fuzzyH,
        totalCost: dp[n][m].cost,
        nonWildcardCount: ref.isWildcardToken.filter(v => !v).length
      };
    }

    // --- Visual Comparison Logic (alignment-based) ---
    function compareAndVisualize(ref, user) {
      const diff = diffWordsWithIndex(ref, user);
      const {
        R, H, missedIdx, addedIdx, matchR, matchH,
        wildcardToUserWords, userMatchedToWildcard, fuzzyR, fuzzyH, isWildcardToken, spanIds, wildcardTexts
      } = diff;

      // Map user index -> wildcard replacement text (first consumed word shows replacement, second hidden)
      const userIdxToWildcardText = new Map();
      if (wildcardToUserWords && spanIds && wildcardTexts) {
        for (const [refIdx, userIdxList] of wildcardToUserWords.entries()) {
          const spanId = spanIds[refIdx];
          const rep = spanId >= 0 && wildcardTexts[spanId] ? wildcardTexts[spanId] : R[refIdx];
          userIdxList.forEach((uIdx, pos) => {
            userIdxToWildcardText.set(uIdx, pos === 0 ? rep : '');
          });
        }
      }

      let refHTML = "";
      let userHTML = "";
      const missingWords = [];

      // Reference side
      for (let i = 0; i < R.length; i++) {
        if (isWildcardToken[i]) {
          refHTML += `<span>${R[i]} </span>`;
        } else if (missedIdx.includes(i)) {
          refHTML += `<span class="highlight-missing">${R[i]} </span>`;
          missingWords.push(R[i]);
        } else if (fuzzyR.has(i)) {
          refHTML += `<span>${R[i]} </span>`;
        } else if (matchR.has(i)) {
          refHTML += `<span>${R[i]} </span>`;
        } else {
          refHTML += `<span>${R[i]} </span>`;
        }
      }

      // User side
      for (let i = 0; i < H.length; i++) {
        if (userIdxToWildcardText.has(i)) {
          const rep = userIdxToWildcardText.get(i);
          userHTML += rep ? `<span>${rep} </span>` : `<span></span>`;
        } else if (userMatchedToWildcard.has(i)) {
          userHTML += `<span>${H[i]} </span>`;
        } else if (addedIdx.includes(i)) {
          userHTML += `<span class="highlight-added">${H[i]} </span>`;
        } else if (fuzzyH.has(i)) {
          userHTML += `<span>${H[i]} </span>`;
        } else if (matchH.has(i)) {
          userHTML += `<span>${H[i]} </span>`;
        } else {
          userHTML += `<span>${H[i]} </span>`;
        }
      }

      document.getElementById('user-stt-display').innerHTML = userHTML;
      document.getElementById('ref-text-display').innerHTML = refHTML;

      // Practice Items: only ref-side deletions outside wildcards
      const pArea = document.getElementById('practice-items');
      pArea.innerHTML = '';
      const seenWords = new Set();
      missingWords.forEach(word => {
        const isWildcardWord = isWildcard(word) || /^_?wildcard_\d+_?$/i.test(word);
        if (!isWildcardWord && !seenWords.has(word)) {
          seenWords.add(word);
          const d = document.createElement('span');
          d.className = 'practice-item';
          d.innerHTML = `${word} <button class="speak-btn" onclick="playTTS('${word}')">🔊</button>`;
          pArea.appendChild(d);
        }
      });
    }

    function playTTS(text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = document.getElementById('sel-accent').value;
      window.speechSynthesis.speak(u);
    }

    // Display score with arch animation and color based on score
    function displayScoreWithAnimation(scoreElementId, score, archElementId, formulaElementId, formulaText, isShadowing) {
      const scoreElement = document.getElementById(scoreElementId);
      const archElement = document.getElementById(archElementId);
      const formulaElement = document.getElementById(formulaElementId);
      
      // Set formula text
      formulaElement.textContent = formulaText;
      
      // Determine color based on score
      let color;
      if (score >= 90) {
        color = '#27ae60'; // Green
      } else if (score >= 70) {
        color = '#f39c12'; // Orange
      } else if (score >= 50) {
        color = '#e67e22'; // Dark orange
      } else {
        color = '#e74c3c'; // Red
      }
      
      // Set arch color
      archElement.style.borderColor = color;
      
      // Reset animation
      archElement.style.animation = 'none';
      archElement.offsetHeight; // Trigger reflow
      archElement.style.animation = '';
      
      // Animate score value
      let currentScore = 0;
      const targetScore = score;
      const duration = 1500; // 1.5 seconds
      const startTime = Date.now();
      
      function updateScore() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Easing function (ease-out)
        const eased = 1 - Math.pow(1 - progress, 3);
        currentScore = Math.round(targetScore * eased);
        
        scoreElement.textContent = currentScore;
        scoreElement.style.color = color;
        
        // Update arch color gradually
        if (progress < 1) {
          requestAnimationFrame(updateScore);
        } else {
          scoreElement.textContent = targetScore;
          scoreElement.style.color = color;
        }
      }
      
      updateScore();
      
      // Trigger arch animation
      setTimeout(() => {
        archElement.style.animation = 'archDraw 1.5s ease-out forwards';
      }, 100);
    }

    // --- Upload & Naming ---
    function uploadData(audioBlob, shadowScore, readScore, speed, userTranscript) {
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = function () {
        const base64Audio = reader.result.split(',')[1];

        // Filename Construction
        const now = new Date();
        const dateStr = formatDate(now, 'YYMMDD');
        const timeStr = formatDate(now, 'HHMMSS');

        const book = document.getElementById('sel-book').value;
        const unit = document.getElementById('sel-unit').value;

        const filenameBase = `${book}_${unit}_${currentTask.id}_${currentUser.id4}_${shadowScore}_${dateStr}_${timeStr}`;

        const payload = {
          filenameBase: filenameBase,
          audioBase64: base64Audio,
          reading_score: readScore,
          shadowing_score: shadowScore,
          playback_speed: speed,
          jsonStr: JSON.stringify({
            book: book,
            unit: unit,
            taskId: currentTask.id,
            userId: currentUser.id4,
            reading_score: readScore,
            shadowing_score: shadowScore,
            playback_speed: speed,
            refText: currentTask.refText,
            userText: userTranscript,
            timestamp: now.toISOString(),
            filenameBase: filenameBase
          })
        };

        google.script.run.withSuccessHandler(() => {
          console.log("Upload Complete");
        }).saveSubmission(payload);
      };
    }

    // --- Utilities ---
    function setStatus(msg, isLoading) {
      document.getElementById('status-area').innerText = msg;
      document.getElementById('loader').style.display = isLoading ? 'block' : 'none';
    }

    function formatDate(date, format) {
      const pad = (n) => (n < 10 ? '0' + n : n);
      const yy = date.getFullYear().toString().substr(-2);
      const mm = pad(date.getMonth() + 1);
      const dd = pad(date.getDate());
      const hh = pad(date.getHours());
      const min = pad(date.getMinutes());
      const ss = pad(date.getSeconds());

      if (format === 'YYMMDD') return yy + mm + dd;
      if (format === 'HHMMSS') return hh + min + ss;
      return '';
    }

    // Tokenize function: Split text into words (normalized)
    function tokenize(text) {
      const normalized = normalizeTextForComparison(text);
      // Remove wildcard markers for tokenization (they're handled separately in comparison)
      const cleaned = normalized.replace(/__WILDCARD_\d+__/g, '');
      return cleaned.split(/\s+/).filter(w => w);
    }

    // WER using wildcard-aware diff (non-wildcard count as denominator)
    function wer(r, h) {
      const diff = diffWordsWithIndex(r, h);
      const nonWildcardCount = diff.isWildcardToken.filter(v => !v).length;
      const dist = diff.totalCost;
      return {
        wer: nonWildcardCount ? dist / nonWildcardCount : 0,
        dist: dist,
        refLen: nonWildcardCount,
        hypLen: diff.H.length
      };
    }
